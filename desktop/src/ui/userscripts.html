<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>用户脚本</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="settings">
  <h1>用户脚本</h1>
  <p class="note">安装 Tampermonkey / Greasemonkey 格式的 .user.js。有 @grant 的脚本跑在各自的隔离环境里（与网页 JS 隔离，DOM 共享）。只安装你信任的脚本。</p>

  <h2>安装</h2>
  <div class="card">
    <form class="row" id="urlForm" autocomplete="off"><input class="text" id="urlInput" placeholder="脚本网址（.user.js、Greasy Fork 脚本页、GitHub 链接）"><button class="btn" type="submit">安装</button></form>
    <div class="row"><div class="label">粘贴代码<div class="sub">包含 // ==UserScript== 元数据块</div></div><button class="btn" id="pasteToggle">粘贴…</button></div>
    <div class="row" id="pasteRow" hidden><textarea class="text" id="codeInput" rows="8" style="flex:1;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder="// ==UserScript==&#10;// @name  …&#10;// ==/UserScript=="></textarea><button class="btn" id="installCode">安装</button></div>
    <div class="row"><div class="label">从文件导入</div><button class="btn" id="installFile">选择文件…</button></div>
  </div>
  <p class="note" id="message"></p>

  <h2>已安装 <button class="btn" id="checkAll" style="float:right;font-weight:normal">检查全部更新</button></h2>
  <div class="card" id="list"></div>

  <div id="codeView" hidden>
    <h2 id="codeTitle"></h2>
    <pre id="codeText" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px"></pre>
    <button class="btn" id="codeClose">关闭</button>
  </div>
<script src="userscripts.js"></script>
</body>
</html>
