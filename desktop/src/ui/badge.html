<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  button { all: unset; box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 20px; background: #111; color: #fff; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  html.dark button { background: #f3f4f6; color: #111; }
  button:hover { filter: brightness(1.15); }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #n { font-weight: 700; }
</style>
</head>
<body>
<button id="b" title="回到浏览器"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg><span><span id="n">0</span> 个标签</span></button>
<script src="badge.js"></script>
</body>
</html>
