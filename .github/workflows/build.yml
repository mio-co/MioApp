name: Build

# 只出 Apple 平台：iOS / iPadOS（未签名 ipa）、macOS（Mac Catalyst，ad-hoc 签名）。Android / Windows 已停止开发（v0.3.4 为最后一版，tag 存档）
# 打 v* 标签时所有 job 都成功后把产物挂到 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    # 纯逻辑单测（不需要 Xcode）：tools/MioAppTests —— UA / 桌面版改写 / 拦截规则清晰度体检（Swift，ios/App/App/MioWebCompat.swift），
    # 以及注入页面的回车键兜底、通行密钥提示脚本（node --test，从同一个 Swift 文件里抽出 JS）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets (audit the lists that ship)
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Shared injected scripts in sync (shared/scripts ↔ MioWebCompat.swift)
        run: node scripts/sync-shared-scripts.mjs --check

      - name: Injected JS tests
        run: node --test tools/MioAppTests/js/*.test.mjs

      - name: Release manifests dry run (SHA256SUMS.txt + altstore-source.json, same script as the release job)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dist-dry"; rm -rf "$D"; mkdir -p "$D"
          V=$(node -p "require('./package.json').version")
          head -c 4096 /dev/urandom > "$D/Mio.ipa"
          head -c 1024 /dev/urandom > "$D/Mio-$V-mac.zip"
          node scripts/release-manifests.mjs --dist "$D" --tag "v$V"
          (cd "$D" && sha256sum -c SHA256SUMS.txt)
          node -e "const s=require(process.argv[1]);const v=s.apps[0].versions[0];if(s.apps[0].bundleIdentifier!=='xyz.mio.app'||!v.downloadURL.endsWith('/Mio.ipa')||v.size!==4096)process.exit(1);console.log(JSON.stringify(v))" "$D/altstore-source.json"

      # 翻译：真实免费接口（微软 Bing / 谷歌）是否还能用。只记录，不阻塞（单测里全部是 mock）
      - name: Translate engines live probe (non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: node tools/MioAppTests/js/translate-probe.mjs

      - name: Swift tests
        run: |
          swift --version
          swift test --package-path tools/MioAppTests

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets (AdGuard filters, Scriptlets, ExtendedCss)
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          ls -la Payload/App.app/AdblockBundle
          test -f Payload/App.app/AdblockBundle/filter-2.txt
          test -f Payload/App.app/AdblockBundle/scriptlets.corelibs.json
          test -f Payload/App.app/mio-translate.js
          # Capacitor 启动时要求本地 public/<server.appStartPath> 存在，否则 exit(1)（v0.1.2–v0.3.0 闪退）
          test -e Payload/App.app/public/mio/nav/index.html
          # 阅读模式 / 强制深色 / 存到 Mio 的页面脚本（www/mio-browser，iOS 与 Mac 共用）
          for f in reader dark mio-save; do test -s Payload/App.app/public/mio-browser/$f.js; done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :UIBackgroundModes' Payload/App.app/Info.plist
          zip -qry Mio.ipa Payload
          ls -lh Mio.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-ipa
          path: Mio.ipa
          retention-days: 14

  ios-sim-smoke:
    # iOS 模拟器冷启动冒烟：原包 + 模拟免费 Apple ID 侧载（bundle id 改成 xyz.mio.app.<TEAMID>、BGTask identifiers 不变、ad-hoc 重签）
    # 任一场景 20 秒内退出 / 崩溃即失败
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            build | tail -n 40
          test -e build-sim/Build/Products/Release-iphonesimulator/App.app/App
          test -e build-sim/Build/Products/Release-iphonesimulator/App.app/public/mio/nav/index.html

      - name: Cold start smoke (original + sideload bundle-id rewrite + stripped plist)
        env:
          SMOKE_STRICT: '1'
          SMOKE_WAIT: '20'
        run: bash scripts/sim-launch-smoke.sh build-sim/Build/Products/Release-iphonesimulator/App.app sim-smoke ios-sim

      - name: iPhone Safari-style browser layout (compact / bottom / top screenshots)
        run: bash scripts/sim-layout-smoke.sh build-sim/Build/Products/Release-iphonesimulator/App.app sim-smoke/layout

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-smoke
          path: sim-smoke
          retention-days: 14

  adblock-check:
    # 在 macOS 上用同一份 MioAdblockCore.swift：转换 + 编译全部列表、查询 YouTube 规则、WKWebView 开/关对比
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Build checker
        working-directory: tools/AdblockCheck
        run: |
          cp ../../ios/App/App/MioAdblockCore.swift Sources/AdblockCheck/
          swift build -c release

      - name: Run checker
        working-directory: tools/AdblockCheck
        run: .build/release/AdblockCheck ../../ios/App/App/AdblockBundle ../../adblock-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adblock-check
          path: adblock-check
          retention-days: 14

  mac:
    # Mac Catalyst（同一个 Xcode 工程；Capacitor 只链接到 iOS，Mac 用纯 WKWebView 根控制器 MioDesktop.swift），ad-hoc 签名
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (Mac Catalyst, unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package (ad-hoc codesign, zip + dmg)
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          mkdir -p out dmgroot
          ditto build-mac/Build/Products/Release-maccatalyst/App.app dmgroot/Mio.app
          APP=dmgroot/Mio.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AdblockBundle/filter-2.txt"
          test -f "$APP/Contents/Resources/AdblockBundle/scriptlets.corelibs.json"
          test -f "$APP/Contents/Resources/mio-translate.js"
          lipo -info "$APP/Contents/MacOS/App"
          ! otool -L "$APP/Contents/MacOS/App" | grep -i capacitor
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/Mio-$V-mac.zip"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Mio $V" -srcfolder dmgroot -ov -format UDZO "out/Mio-$V-mac.dmg"
          ls -lh out

      - name: In-app updater (helper script replaces a copy of Mio.app from the release zip; wrong bundle id keeps the old app)
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          T="$RUNNER_TEMP/upd"; rm -rf "$T"; mkdir -p "$T"
          node tools/MioAppTests/js/mac-install-script.mjs > "$T/install.sh"
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dmgroot/Mio.app/Contents/Info.plist)
          run() { # $1 = case name, $2 = bundle id passed to the script
            rm -rf "$T/$1"; mkdir -p "$T/$1/apps" "$T/$1/work"
            ditto dmgroot/Mio.app "$T/$1/apps/Mio.app"
            echo old > "$T/$1/apps/Mio.app/Contents/old-marker"
            cp "out/Mio-$V-mac.zip" "$T/$1/work/update.zip"
            sleep 1 & local pid=$!
            set +e
            MIO_UPDATE_NO_RELAUNCH=1 /bin/sh "$T/install.sh" "$pid" "$T/$1/work/update.zip" "$T/$1/apps/Mio.app" "$T/$1/work" "$T/$1/update.log" "$2"
            local code=$?
            set -e
            echo "--- $1 (exit $code)"; cat "$T/$1/update.log"
            return $code
          }
          run ok "$ID"
          grep -q '^installed$' "$T/ok/update.log"
          test ! -e "$T/ok/apps/Mio.app/Contents/old-marker"
          test -f "$T/ok/apps/Mio.app/Contents/Info.plist"
          test ! -e "$T/ok/work/update.zip"
          test ! -e "$T/ok/work/old.app"
          codesign --verify --deep --strict "$T/ok/apps/Mio.app"
          if run wrongid "xyz.example.other"; then echo "expected failure for wrong bundle id"; exit 1; fi
          grep -q 'unexpected bundle id' "$T/wrongid/update.log"
          test -e "$T/wrongid/apps/Mio.app/Contents/old-marker"

      - name: WebKit MSE baseline (AppKit WKWebView on this runner, informational)
        continue-on-error: true
        run: |
          # macOS 没有 timeout 命令；脚本自己 40 秒超时退出
          swift scripts/mac-appkit-mse-probe.swift https://example.com/ || true

      - name: Smoke test (public site page → window.MioDesktop.browser.open → in-app browser + adblock ready)
        run: |
          # 不用 -e：App 非 0 退出时 wait 会直接终止脚本，日志和 JSON 就看不到了
          set +e -u
          mkdir -p smoke-diag
          OUT="$PWD/smoke-diag/smoke-mac.json"
          MIO_SMOKE_OUT="$OUT" dmgroot/Mio.app/Contents/MacOS/App > smoke-diag/mac-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 270); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then echo "still running after 270s"; kill $PID; fi
          wait $PID
          CODE=$?
          echo "--- mac-smoke.log (Mio lines) ---"
          grep -a 'Mio' smoke-diag/mac-smoke.log | tail -60
          echo "--- mac-smoke.log (tail) ---"
          tail -40 smoke-diag/mac-smoke.log
          echo "--- smoke json ---"
          cat "$OUT" 2>/dev/null || echo "(no smoke json: app crashed or timed out before writing it)"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E '^App|Mio' | head -3 | while read f; do echo "--- crash report $f ---"; head -80 ~/Library/Logs/DiagnosticReports/"$f"; done
          echo "exit $CODE"
          test "$CODE" = 0

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-diag
          path: smoke-diag
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-mac
          path: out/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, ios, ios-sim-smoke, mac]
    runs-on: ubuntu-24.04
    steps:
      # 软件内更新用的清单：scripts/release-manifests.mjs 读 pbxproj（buildVersion / minOSVersion）和 Info.plist（隐私说明）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Mio-*
          path: dist
          merge-multiple: true

      # SHA256SUMS.txt（Mac 更新器校验 zip）+ altstore-source.json（SideStore / AltStore 源，
      # 稳定地址 https://github.com/mio-co/MioApp/releases/latest/download/altstore-source.json）。
      - name: In-app update manifests
        run: node scripts/release-manifests.mjs --dist dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
