name: Build

# iOS（未签名 ipa）、Android（apk）、Windows（Electron exe）、macOS（Mac Catalyst，ad-hoc 签名）
# 打 v* 标签时所有平台都成功后把产物挂到 Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    # 纯逻辑单测（不需要 Xcode）：tools/MioAppTests —— UA / 桌面版改写 / 拦截规则清晰度体检（Swift，ios/App/App/MioWebCompat.swift），
    # 以及注入页面的回车键兜底、通行密钥提示脚本（node --test，从同一个 Swift 文件里抽出 JS）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets (audit the lists that ship)
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Shared injected scripts in sync (shared/scripts ↔ MioWebCompat.swift)
        run: node scripts/sync-shared-scripts.mjs --check

      - name: Injected JS tests
        run: node --test tools/MioAppTests/js/*.test.mjs

      - name: Release manifests dry run (SHA256SUMS.txt + altstore-source.json, same script as the release job)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dist-dry"; rm -rf "$D"; mkdir -p "$D"
          V=$(node -p "require('./package.json').version")
          head -c 4096 /dev/urandom > "$D/Mio.ipa"
          head -c 1024 /dev/urandom > "$D/Mio-$V-mac.zip"
          printf 'version: %s\n' "$V" > "$D/latest.yml"
          node scripts/release-manifests.mjs --dist "$D" --tag "v$V"
          (cd "$D" && sha256sum -c SHA256SUMS.txt)
          node -e "const s=require(process.argv[1]);const v=s.apps[0].versions[0];if(s.apps[0].bundleIdentifier!=='xyz.mio.app'||!v.downloadURL.endsWith('/Mio.ipa')||v.size!==4096)process.exit(1);console.log(JSON.stringify(v))" "$D/altstore-source.json"

      - name: Swift tests
        run: |
          swift --version
          swift test --package-path tools/MioAppTests

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets (AdGuard filters, Scriptlets, ExtendedCss)
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          ls -la Payload/App.app/AdblockBundle
          test -f Payload/App.app/AdblockBundle/filter-2.txt
          test -f Payload/App.app/AdblockBundle/scriptlets.corelibs.json
          # Capacitor 启动时要求本地 public/<server.appStartPath> 存在，否则 exit(1)（v0.1.2–v0.3.0 闪退）
          test -e Payload/App.app/public/mio/nav/index.html
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :UIBackgroundModes' Payload/App.app/Info.plist
          zip -qry Mio.ipa Payload
          ls -lh Mio.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-ipa
          path: Mio.ipa
          retention-days: 14

  ios-sim-smoke:
    # iOS 模拟器冷启动冒烟：原包 + 模拟免费 Apple ID 侧载（bundle id 改成 xyz.mio.app.<TEAMID>、BGTask identifiers 不变、ad-hoc 重签）
    # 任一场景 20 秒内退出 / 崩溃即失败
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            build | tail -n 40
          test -e build-sim/Build/Products/Release-iphonesimulator/App.app/App
          test -e build-sim/Build/Products/Release-iphonesimulator/App.app/public/mio/nav/index.html

      - name: Cold start smoke (original + sideload bundle-id rewrite + stripped plist)
        env:
          SMOKE_STRICT: '1'
          SMOKE_WAIT: '20'
        run: bash scripts/sim-launch-smoke.sh build-sim/Build/Products/Release-iphonesimulator/App.app sim-smoke ios-sim

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-smoke
          path: sim-smoke
          retention-days: 14

  adblock-check:
    # 在 macOS 上用同一份 MioAdblockCore.swift：转换 + 编译全部列表、查询 YouTube 规则、WKWebView 开/关对比
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Build checker
        working-directory: tools/AdblockCheck
        run: |
          cp ../../ios/App/App/MioAdblockCore.swift Sources/AdblockCheck/
          swift build -c release

      - name: Run checker
        working-directory: tools/AdblockCheck
        run: .build/release/AdblockCheck ../../ios/App/App/AdblockBundle ../../adblock-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adblock-check
          path: adblock-check
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native/mioadblock/target
          key: cargo-android-${{ hashFiles('native/mioadblock/Cargo.lock') }}

      - name: Rust Android targets + cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          command -v cargo-ndk || cargo install cargo-ndk --locked
          cargo ndk --version
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Fetch adblock assets → android/app/src/main/assets/adblock
        run: |
          node scripts/fetch-adblock-assets.mjs android/app/src/main/assets/adblock
          ls -la android/app/src/main/assets/adblock

      - name: Test mioadblock on host (real lists)
        working-directory: native/mioadblock
        env:
          MIO_ADBLOCK_BUNDLE: ${{ github.workspace }}/android/app/src/main/assets/adblock
          MIO_ADBLOCK_REQUIRE: '1'
        run: cargo test --release -- --nocapture

      - name: Cross-compile libmioadblock.so (arm64-v8a, x86_64)
        working-directory: native/mioadblock
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 --platform 24 -o ../../android/app/src/main/jniLibs build --release
          ls -laR ../../android/app/src/main/jniLibs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Unit tests (start URL = https://mio.300031.xyz/mio/nav)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Check synced Capacitor config start URL
        run: node -e "const c=require('./android/app/src/main/assets/capacitor.config.json');const u=c.server.url+c.server.appStartPath;console.log(u);if(u!=='https://mio.300031.xyz/mio/nav')process.exit(1)"

      - name: Gradle assembleRelease + assembleDebug
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Package APKs
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          ls -la android/app/build/outputs/apk/release android/app/build/outputs/apk/debug
          REL=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          # release 只出未签名包；发布后在本地用固定 keystore 签名为 Mio.apk 再上传（不在 CI 里放 keystore）
          case "$REL" in
            *unsigned*) cp "$REL" "out/Mio-$V-android-unsigned.apk" ;;
            *) echo "release APK unexpectedly signed: $REL"; exit 1 ;;
          esac
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Mio-$V-android-debug.apk"
          for f in out/*.apk; do
            echo "== $f"; ls -l "$f"
            unzip -l "$f" | grep -E 'lib/(arm64-v8a|x86_64)/libmioadblock.so' 
            unzip -l "$f" | grep -E 'assets/adblock/(filter-2.txt|filter-0.txt|scriptlets.corelibs.json|extended-css.min.js|manifest.json)' | wc -l | grep -qx 5
            unzip -l "$f" | grep -q classes.dex
            unzip -l "$f" | grep -q 'assets/scripts/youtube-focus.js'
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "out/Mio-$V-android-debug.apk" | head -5
          "$BT/apksigner" verify --print-certs "out/Mio-$V-android-debug.apk" | head -5
          for f in out/*.apk; do echo "== verify $f"; "$BT/apksigner" verify "$f" 2>&1 | head -3 || true; done

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-android
          path: out/*.apk
          retention-days: 14

  android-emulator:
    # Android 模拟器冷启动：起始地址必须是 https://mio.300031.xyz/mio/nav，首个页面能加载（未登录 → Access / 登录页也算通过）
    needs: [android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Mio-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold start on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash scripts/android-emulator-smoke.sh "$(ls apk/*-android-debug.apk | head -1)" android-smoke
            bash scripts/android-ytfocus-smoke.sh android-smoke/ytfocus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-smoke
          path: android-smoke
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch adblock assets (AdGuard lists, uBO syntax + resources.json)
        run: node scripts/fetch-assets.mjs assets/adblock

      - name: Unit tests (+ engine from real lists)
        env:
          MIO_ADBLOCK_REQUIRE: '1'
        run: npm test

      - name: electron-builder (NSIS + portable, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: In-app update metadata (latest.yml + blockmap for electron-updater, app-update.yml, electron-updater in app.asar)
        run: |
          set -euo pipefail
          cat dist/latest.yml
          grep -q 'Mio-Setup-.*-x64.exe' dist/latest.yml
          grep -q 'sha512:' dist/latest.yml
          ls -la dist/*.blockmap
          cat dist/win-unpacked/resources/app-update.yml
          grep -q 'provider: github' dist/win-unpacked/resources/app-update.yml
          node -e "const a=require('@electron/asar');const f=a.listPackage('dist/win-unpacked/resources/app.asar');if(!f.some(x=>/[\\\\/]node_modules[\\\\/]electron-updater[\\\\/]/.test(x)))process.exit(1);console.log('electron-updater packaged')"

      - name: Smoke test packaged app (engine, MioDesktop bridge, YouTube blocking, whitelist)
        run: |
          OUT="$RUNNER_TEMP/smoke-win.json"
          set +e
          MIO_SMOKE_OUT="$OUT" timeout 240 ./dist/win-unpacked/Mio.exe
          CODE=$?
          set -e
          cat "$OUT" || true
          echo "exit $CODE"
          test "$CODE" = 0

      - name: List artifacts (+ Authenticode status, expected NotSigned)
        run: |
          ls -la dist
          powershell -NoProfile -Command "Get-ChildItem dist\*.exe | ForEach-Object { '{0}: {1}' -f \$_.Name, (Get-AuthenticodeSignature \$_.FullName).Status }"

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          retention-days: 14

  mac:
    # Mac Catalyst（同一个 Xcode 工程；Capacitor 只链接到 iOS，Mac 用纯 WKWebView 根控制器 MioDesktop.swift），ad-hoc 签名
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch adblock assets
        run: node scripts/fetch-adblock-assets.mjs ios/App/App/AdblockBundle

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (Mac Catalyst, unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package (ad-hoc codesign, zip + dmg)
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          mkdir -p out dmgroot
          ditto build-mac/Build/Products/Release-maccatalyst/App.app dmgroot/Mio.app
          APP=dmgroot/Mio.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AdblockBundle/filter-2.txt"
          test -f "$APP/Contents/Resources/AdblockBundle/scriptlets.corelibs.json"
          lipo -info "$APP/Contents/MacOS/App"
          ! otool -L "$APP/Contents/MacOS/App" | grep -i capacitor
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -20
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/Mio-$V-mac.zip"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Mio $V" -srcfolder dmgroot -ov -format UDZO "out/Mio-$V-mac.dmg"
          ls -lh out

      - name: In-app updater (helper script replaces a copy of Mio.app from the release zip; wrong bundle id keeps the old app)
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          T="$RUNNER_TEMP/upd"; rm -rf "$T"; mkdir -p "$T"
          node tools/MioAppTests/js/mac-install-script.mjs > "$T/install.sh"
          ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dmgroot/Mio.app/Contents/Info.plist)
          run() { # $1 = case name, $2 = bundle id passed to the script
            rm -rf "$T/$1"; mkdir -p "$T/$1/apps" "$T/$1/work"
            ditto dmgroot/Mio.app "$T/$1/apps/Mio.app"
            echo old > "$T/$1/apps/Mio.app/Contents/old-marker"
            cp "out/Mio-$V-mac.zip" "$T/$1/work/update.zip"
            sleep 1 & local pid=$!
            set +e
            MIO_UPDATE_NO_RELAUNCH=1 /bin/sh "$T/install.sh" "$pid" "$T/$1/work/update.zip" "$T/$1/apps/Mio.app" "$T/$1/work" "$T/$1/update.log" "$2"
            local code=$?
            set -e
            echo "--- $1 (exit $code)"; cat "$T/$1/update.log"
            return $code
          }
          run ok "$ID"
          grep -q '^installed$' "$T/ok/update.log"
          test ! -e "$T/ok/apps/Mio.app/Contents/old-marker"
          test -f "$T/ok/apps/Mio.app/Contents/Info.plist"
          test ! -e "$T/ok/work/update.zip"
          test ! -e "$T/ok/work/old.app"
          codesign --verify --deep --strict "$T/ok/apps/Mio.app"
          if run wrongid "xyz.example.other"; then echo "expected failure for wrong bundle id"; exit 1; fi
          grep -q 'unexpected bundle id' "$T/wrongid/update.log"
          test -e "$T/wrongid/apps/Mio.app/Contents/old-marker"

      - name: Smoke test (public site page → window.MioDesktop.browser.open → in-app browser + adblock ready)
        run: |
          # 不用 -e：App 非 0 退出时 wait 会直接终止脚本，日志和 JSON 就看不到了
          set +e -u
          mkdir -p smoke-diag
          OUT="$PWD/smoke-diag/smoke-mac.json"
          MIO_SMOKE_OUT="$OUT" dmgroot/Mio.app/Contents/MacOS/App > smoke-diag/mac-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 210); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then echo "still running after 210s"; kill $PID; fi
          wait $PID
          CODE=$?
          echo "--- mac-smoke.log (Mio lines) ---"
          grep -a 'Mio' smoke-diag/mac-smoke.log | tail -60
          echo "--- mac-smoke.log (tail) ---"
          tail -40 smoke-diag/mac-smoke.log
          echo "--- smoke json ---"
          cat "$OUT" 2>/dev/null || echo "(no smoke json: app crashed or timed out before writing it)"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E '^App|Mio' | head -3 | while read f; do echo "--- crash report $f ---"; head -80 ~/Library/Logs/DiagnosticReports/"$f"; done
          echo "exit $CODE"
          test "$CODE" = 0

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-diag
          path: smoke-diag
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-mac
          path: out/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, ios, ios-sim-smoke, android, android-emulator, windows, mac]
    runs-on: ubuntu-24.04
    steps:
      # 软件内更新用的清单：scripts/release-manifests.mjs 读 pbxproj（buildVersion / minOSVersion）和 Info.plist（隐私说明）
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Mio-*
          path: dist
          merge-multiple: true

      # SHA256SUMS.txt（Mac 更新器校验 zip）+ altstore-source.json（SideStore / AltStore 源，
      # 稳定地址 https://github.com/mio-co/MioApp/releases/latest/download/altstore-source.json）。
      # Windows 的 latest.yml + *.blockmap 由 electron-builder 生成，随 Mio-windows 产物一起上传。
      # Mio.apk / Mio.apk.sha256 发布后由本地签名脚本上传（keystore 不进 CI）。
      - name: In-app update manifests
        run: node scripts/release-manifests.mjs --dist dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
