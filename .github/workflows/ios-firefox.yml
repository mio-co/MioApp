name: iOS (firefox-ios fork)

# Mio iOS/iPadOS 0.4.x：apple/ios 是 firefox-ios 的 fork（MPL-2.0）。
# 只在 apple/ios 或本文件变化时跑；与 build.yml 互不影响（旧的 Capacitor iOS 仍由 build.yml 构建）。
on:
  push:
    branches: [feat/ios-firefox]
    paths: ['apple/ios/**', '.github/workflows/ios-firefox.yml']
  pull_request:
    paths: ['apple/ios/**', '.github/workflows/ios-firefox.yml']

concurrency:
  group: ios-firefox-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FF_ROOT: apple/ios

jobs:
  sim-smoke:
    # 模拟器构建（Firefox 配置 = release 渠道）+ 启动冒烟：mio://home、打开网页、底部工具栏、标签页概览截图
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (firefox-ios v158 wants Xcode 26.5)
        run: bash apple/ios/mio/ci/select-xcode.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            build-sim/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ff-spm-sim-${{ hashFiles('apple/ios/firefox-ios/Client.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/ios/MozillaRustComponents/Package.swift') }}
          restore-keys: ff-spm-sim-

      - name: Bootstrap (nimbus-fml)
        run: bash apple/ios/mio/ci/bootstrap.sh

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/ios/firefox-ios/Client.xcodeproj \
            -scheme Firefox \
            -configuration Firefox \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build-sim.log | grep -E "error:|warning: .*Mio|\*\* BUILD|Signing|Touch .*\.app" | head -n 400
          ls build-sim/Build/Products/Firefox-iphonesimulator/

      - name: Build errors (on failure)
        if: failure()
        run: grep -n -B2 -A6 "error:" build-sim.log | head -n 300 || tail -n 200 build-sim.log

      - name: Simulator smoke
        run: bash apple/ios/mio/ci/sim-smoke.sh build-sim/Build/Products/Firefox-iphonesimulator/Client.app sim-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mio-ios-firefox-sim-smoke
          path: |
            sim-smoke
            build-sim.log
          retention-days: 14

  ipa:
    # 真机构建（不签名）→ Mio.ipa（与现有 SideStore / AltStore 源方式一致：未签名 ipa，由 SideStore 侧载时重签）
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: bash apple/ios/mio/ci/select-xcode.sh

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ff-spm-dev-${{ hashFiles('apple/ios/firefox-ios/Client.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/ios/MozillaRustComponents/Package.swift') }}
          restore-keys: ff-spm-dev-

      - name: Bootstrap (nimbus-fml)
        run: bash apple/ios/mio/ci/bootstrap.sh

      - name: Build (unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project apple/ios/firefox-ios/Client.xcodeproj \
            -scheme Firefox \
            -configuration Firefox \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build-dev.log | grep -E "error:|\*\* BUILD" | head -n 400

      - name: Build errors (on failure)
        if: failure()
        run: grep -n -B2 -A6 "error:" build-dev.log | head -n 300 || tail -n 200 build-dev.log

      - name: Package IPA
        run: bash apple/ios/mio/ci/package-ipa.sh build/Build/Products/Firefox-iphoneos/Client.app Mio-ios-firefox.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mio-ios-firefox-ipa
          path: Mio-ios-firefox.ipa
          retention-days: 14
